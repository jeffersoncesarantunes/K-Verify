name: K-Verify CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make clean && make
      - name: Run tests
        run: make test
      - name: Verify binary
        run: ./kverify --help
      - name: Check for banned functions
        run: '! grep -rn "\<gets(" src/ include/ || exit 1'
      - name: Shellcheck (if scripts present)
        run: |
          shellcheck --version
          if ls scripts/*.sh 2>/dev/null; then shellcheck scripts/*.sh; fi
